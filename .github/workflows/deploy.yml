name: Deploy to GitHub Pages

# site/ 폴더만 GitHub Pages로 서빙한다. 빌드 단계 없음 — 정적 파일 그대로 업로드.
on:
  push:
    branches: [main, master]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  # build-pdf.yml이 GITHUB_TOKEN으로 새 PDF를 커밋/푸시하면 그 푸시는 워크플로우를
  # 재트리거하지 않는다(깃허브 루프 방지). 그래서 완료 이벤트로 이어받아 배포한다.
  workflow_run:
    workflows: ['Build Portfolio PDF']
    types: [completed]
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 런은 취소하지 않고 큐잉(발행 도중 중단 방지).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_run으로 왔을 땐 build-pdf가 성공한 경우에만 배포
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Upload site/ artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
