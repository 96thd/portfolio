<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>PORTFOLIO — SUHO SONG (PDF)</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  @page { size: 360mm 202.5mm; margin: 0; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #2c2c29;
    color: #f0ede8;
    font-family: 'DM Mono', 'Noto Sans KR', 'Noto Sans SC', 'Noto Sans JP', monospace;
  }
  .sheet-bg {
    position: fixed;
    top: -3mm; left: -3mm; right: -3mm; bottom: -3mm;
    background: #2c2c29;
    z-index: -1;
  }
  .page {
    width: 360mm;
    height: 202.5mm;
    padding: 9mm 13mm;
    background: #2c2c29;
    page-break-after: always;
    break-after: page;
    position: relative;
    overflow: hidden;
  }
  .page:last-child { page-break-after: auto; break-after: auto; }

  /* ── Cover: 좌측 텍스트 + 우측 QR ── */
  .cover {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: center;
  }
  .cover .cover-left {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    text-align: left;
    flex: 1;
  }
  .cover .cover-right {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    flex-shrink: 0;
    width: 52mm;
  }
  .cover h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 140px;
    line-height: 0.88;
    letter-spacing: 0.04em;
    color: #f0ede8;
    margin-bottom: 10px;
    position: relative;
  }
  .cover .sub {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 42px;
    letter-spacing: 0.04em;
    color: #f0ede8;
    margin-bottom: 24px;
    position: relative;
  }
  .cover .tag {
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #cccccc;
    margin-bottom: 14px;
  }
  .cover .ig {
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.1em;
    color: #f0ede8;
    margin-bottom: 10px;
  }
  .cover .desc p {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: #aaaaaa;
    text-transform: uppercase;
    line-height: 1.9;
  }
  .cover .qr-wrap svg { display: block; }

  /* ── Works grid ── */
  .works-page { display: flex; flex-direction: column; }
  .page-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4mm;
    padding-bottom: 2mm;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    flex-shrink: 0;
  }
  .page-header .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 0.1em;
    color: #f0ede8;
    position: relative;
  }
  .page-header .pageno {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: #888880;
  }
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 84mm);
    grid-template-rows: repeat(3, 1fr);
    justify-content: center;
    gap: 4mm 5mm;
    min-height: 0;
  }
  .item {
    display: flex;
    flex-direction: column;
    width: 84mm;
    text-decoration: none;
    color: inherit;
    background: transparent;
  }
  .item .thumb {
    width: 84mm;
    height: 47.25mm;
    background: #222220;
    border-radius: 0;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(240,237,232,0.10);
  }
  .item .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .item .title {
    font-family: 'Noto Sans KR', 'Noto Sans SC', 'Noto Sans JP', sans-serif;
    font-size: 9px;
    font-weight: 400;
    line-height: 1.35;
    color: rgba(240,237,232,0.72);
    margin-top: 5px;
    text-align: left;
    background: transparent;
  }
</style>
</head>
<body>
<div class="sheet-bg"></div>
<div id="root"></div>
<script src="js/works.js"></script>
<script>
(function() {
  /* ═══════════════════════════════════════════════════════
     QR 생성기 — https://96thd.github.io/portfolio/
     검증된 QR 행렬(버전 3, 29×29, ECC M)을 단일 <path>로 렌더.
     · 칸마다 <rect>를 쓰면 Puppeteer/Skia가 인접 사각형 사이에
       서브픽셀 seam(가는 격자선)을 남겨 스캐너 인식이 깨진다.
       밝은 모듈 전체를 하나의 path로 합쳐 단일 fill → seam 없음.
     · 행렬은 jsQR 디코딩으로 URL 일치 검증 완료(빌드 시 1회 검증).
     · viewBox는 모듈 단위(0 0 29 29)라 어떤 크기로도 깔끔하게 스케일.
  ═══════════════════════════════════════════════════════ */
  var QR_N = 29;
  var QR_PATH = 'M0 0h7v1h-7zM8 0h2v1h-2zM11 0h5v1h-5zM17 0h4v1h-4zM22 0h7v1h-7zM0 1h1v1h-1zM6 1h1v1h-1zM8 1h1v1h-1zM11 1h3v1h-3zM16 1h1v1h-1zM18 1h1v1h-1zM22 1h1v1h-1zM28 1h1v1h-1zM0 2h1v1h-1zM2 2h3v1h-3zM6 2h1v1h-1zM9 2h3v1h-3zM16 2h1v1h-1zM18 2h2v1h-2zM22 2h1v1h-1zM24 2h3v1h-3zM28 2h1v1h-1zM0 3h1v1h-1zM2 3h3v1h-3zM6 3h1v1h-1zM8 3h1v1h-1zM10 3h1v1h-1zM14 3h2v1h-2zM17 3h3v1h-3zM22 3h1v1h-1zM24 3h3v1h-3zM28 3h1v1h-1zM0 4h1v1h-1zM2 4h3v1h-3zM6 4h1v1h-1zM11 4h2v1h-2zM14 4h1v1h-1zM16 4h1v1h-1zM19 4h1v1h-1zM22 4h1v1h-1zM24 4h3v1h-3zM28 4h1v1h-1zM0 5h1v1h-1zM6 5h1v1h-1zM12 5h2v1h-2zM15 5h5v1h-5zM22 5h1v1h-1zM28 5h1v1h-1zM0 6h7v1h-7zM8 6h1v1h-1zM10 6h1v1h-1zM12 6h1v1h-1zM14 6h1v1h-1zM16 6h1v1h-1zM18 6h1v1h-1zM20 6h1v1h-1zM22 6h7v1h-7zM8 7h2v1h-2zM12 7h1v1h-1zM15 7h5v1h-5zM0 8h1v1h-1zM2 8h2v1h-2zM5 8h3v1h-3zM10 8h1v1h-1zM12 8h2v1h-2zM15 8h4v1h-4zM22 8h1v1h-1zM25 8h1v1h-1zM27 8h2v1h-2zM0 9h3v1h-3zM7 9h1v1h-1zM9 9h1v1h-1zM12 9h4v1h-4zM19 9h1v1h-1zM21 9h4v1h-4zM28 9h1v1h-1zM2 10h3v1h-3zM6 10h1v1h-1zM13 10h1v1h-1zM16 10h2v1h-2zM20 10h2v1h-2zM23 10h1v1h-1zM26 10h2v1h-2zM3 11h1v1h-1zM8 11h4v1h-4zM15 11h1v1h-1zM22 11h1v1h-1zM24 11h1v1h-1zM28 11h1v1h-1zM1 12h1v1h-1zM4 12h1v1h-1zM6 12h2v1h-2zM9 12h1v1h-1zM11 12h2v1h-2zM14 12h1v1h-1zM17 12h1v1h-1zM21 12h1v1h-1zM25 12h2v1h-2zM0 13h2v1h-2zM5 13h1v1h-1zM7 13h1v1h-1zM9 13h4v1h-4zM14 13h2v1h-2zM19 13h1v1h-1zM22 13h1v1h-1zM26 13h3v1h-3zM1 14h3v1h-3zM5 14h3v1h-3zM9 14h5v1h-5zM17 14h5v1h-5zM26 14h3v1h-3zM1 15h3v1h-3zM7 15h2v1h-2zM11 15h2v1h-2zM14 15h1v1h-1zM16 15h1v1h-1zM20 15h5v1h-5zM27 15h1v1h-1zM0 16h1v1h-1zM3 16h2v1h-2zM6 16h1v1h-1zM8 16h1v1h-1zM11 16h1v1h-1zM14 16h2v1h-2zM18 16h1v1h-1zM21 16h1v1h-1zM24 16h2v1h-2zM27 16h1v1h-1zM1 17h1v1h-1zM3 17h1v1h-1zM5 17h1v1h-1zM7 17h1v1h-1zM11 17h1v1h-1zM14 17h2v1h-2zM18 17h1v1h-1zM20 17h1v1h-1zM23 17h1v1h-1zM25 17h3v1h-3zM0 18h1v1h-1zM3 18h1v1h-1zM5 18h2v1h-2zM8 18h1v1h-1zM10 18h9v1h-9zM26 18h1v1h-1zM3 19h3v1h-3zM7 19h4v1h-4zM13 19h2v1h-2zM17 19h1v1h-1zM20 19h3v1h-3zM26 19h1v1h-1zM1 20h4v1h-4zM6 20h1v1h-1zM8 20h2v1h-2zM12 20h7v1h-7zM20 20h7v1h-7zM8 21h1v1h-1zM10 21h3v1h-3zM16 21h1v1h-1zM20 21h1v1h-1zM24 21h5v1h-5zM0 22h7v1h-7zM8 22h4v1h-4zM14 22h1v1h-1zM17 22h4v1h-4zM22 22h1v1h-1zM24 22h2v1h-2zM27 22h1v1h-1zM0 23h1v1h-1zM6 23h1v1h-1zM8 23h1v1h-1zM10 23h1v1h-1zM12 23h3v1h-3zM20 23h1v1h-1zM24 23h2v1h-2zM0 24h1v1h-1zM2 24h3v1h-3zM6 24h1v1h-1zM9 24h2v1h-2zM17 24h1v1h-1zM20 24h5v1h-5zM26 24h2v1h-2zM0 25h1v1h-1zM2 25h3v1h-3zM6 25h1v1h-1zM8 25h1v1h-1zM13 25h1v1h-1zM15 25h3v1h-3zM20 25h2v1h-2zM24 25h2v1h-2zM28 25h1v1h-1zM0 26h1v1h-1zM2 26h3v1h-3zM6 26h1v1h-1zM8 26h2v1h-2zM13 26h1v1h-1zM17 26h2v1h-2zM26 26h1v1h-1zM28 26h1v1h-1zM0 27h1v1h-1zM6 27h1v1h-1zM10 27h1v1h-1zM13 27h1v1h-1zM16 27h1v1h-1zM18 27h7v1h-7zM27 27h1v1h-1zM0 28h7v1h-7zM8 28h3v1h-3zM12 28h1v1h-1zM14 28h2v1h-2zM18 28h4v1h-4zM23 28h3v1h-3zM27 28h1v1h-1z';
  function buildQRSVG(sizePx) {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', sizePx);
    svg.setAttribute('height', sizePx);
    svg.setAttribute('viewBox', '0 0 ' + QR_N + ' ' + QR_N);
    svg.setAttribute('shape-rendering', 'crispEdges');
    svg.innerHTML =
      '<rect width="' + QR_N + '" height="' + QR_N + '" fill="#2c2c29"/>' +
      '<path fill="#f0ede8" d="' + QR_PATH + '"/>';
    return svg;
  }

  /* ═══════════════════════════════════════════════════════
     페이지 렌더링
  ═══════════════════════════════════════════════════════ */
  var PER_PAGE = 9;
  var root = document.getElementById('root');

  // ── Cover ──
  var cover = document.createElement('div');
  cover.className = 'page cover';

  var coverLeft = document.createElement('div');
  coverLeft.className = 'cover-left';
  coverLeft.innerHTML =
    '<h1>SUHO<br>SONG</h1>' +
    '<div class="sub">MV PRODUCER</div>' +
    '<div class="tag">PORTFOLIO</div>' +
    '<div class="ig">@sh0_614</div>' +
    '<div class="desc">' +
      '<p>Crafting visuals for music</p>' +
      '<p>Based in Seoul, Korea</p>' +
      '<p>Open for collaboration</p>' +
    '</div>';
  cover.appendChild(coverLeft);

  var coverRight = document.createElement('div');
  coverRight.className = 'cover-right';
  var qrWrap = document.createElement('div');
  qrWrap.className = 'qr-wrap';
  try {
    qrWrap.appendChild(buildQRSVG(90));
  } catch(e) {
    qrWrap.style.display = 'none';
  }
  coverRight.appendChild(qrWrap);
  cover.appendChild(coverRight);
  root.appendChild(cover);

  // ── Works pages ──
  var realWorks = works.filter(function(w) { return w.id; });
  var totalPages = Math.ceil(realWorks.length / PER_PAGE);
  for (var p = 0; p < totalPages; p++) {
    var page = document.createElement('div');
    page.className = 'page works-page';
    var slice = realWorks.slice(p * PER_PAGE, (p + 1) * PER_PAGE);
    var items = slice.map(function(w) {
      return '<a class="item" href="https://youtu.be/' + w.id + '" target="_blank" rel="noopener">' +
        '<div class="thumb">' +
        '<img src="https://i.ytimg.com/vi/' + w.id + '/maxresdefault.jpg"' +
        ' onerror="this.src=\'https://i.ytimg.com/vi/' + w.id + '/hqdefault.jpg\'"' +
        ' crossorigin="anonymous">' +
        '</div>' +
        '<div class="title">' + escapeHtml(w.title) + '</div>' +
        '</a>';
    }).join('');
    page.innerHTML =
      '<div class="page-header">' +
        '<div class="title">WORKS</div>' +
        '<div class="pageno">' + (p + 1) + ' / ' + totalPages + '</div>' +
      '</div>' +
      '<div class="grid">' + items + '</div>';
    root.appendChild(page);
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // ── Glow via SVG filter ──
  var glowFilter = function(id, std, slope, pad) {
    return '<filter id="' + id + '" x="-' + pad + '%" y="-' + pad + '%" ' +
      'width="' + (100+pad*2) + '%" height="' + (100+pad*2) + '%" color-interpolation-filters="sRGB">' +
      '<feGaussianBlur in="SourceGraphic" stdDeviation="' + std + '" result="b"/>' +
      '<feComponentTransfer in="b" result="d"><feFuncA type="linear" slope="' + slope + '"/></feComponentTransfer>' +
      '<feMerge><feMergeNode in="d"/><feMergeNode in="SourceGraphic"/></feMerge>' +
      '</filter>';
  };
  var svgDefs = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svgDefs.setAttribute('width','0'); svgDefs.setAttribute('height','0');
  svgDefs.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden;';
  svgDefs.innerHTML = '<defs>' +
    glowFilter('glow-lg',2.8,0.45,25) +
    glowFilter('glow-md',1.8,0.38,20) +
    glowFilter('glow-sm',1.2,0.30,15) + '</defs>';
  document.body.prepend(svgDefs);

  document.querySelector('.cover h1').style.filter = 'url(#glow-lg)';
  document.querySelector('.cover .sub').style.filter = 'url(#glow-md)';
  document.querySelectorAll('.page-header .title').forEach(function(el) {
    el.style.filter = 'url(#glow-sm)';
  });

  // ── 모든 이미지 + 폰트 로드 완료 시 신호 ──
  // SVG QR은 동기 생성 — 이미지/폰트 대기만으로 충분
  Promise.all([
    document.fonts.ready,
    new Promise(function(resolve) {
      var imgs = document.querySelectorAll('img');
      if (imgs.length === 0) return resolve();
      var loaded = 0;
      var check = function() { if (++loaded >= imgs.length) resolve(); };
      imgs.forEach(function(img) {
        if (img.complete) check();
        else { img.addEventListener('load', check); img.addEventListener('error', check); }
      });
    })
  ]).then(function() {
    window.__pdfReady = true;
    document.body.dataset.ready = 'true';
  });
})();
</script>
</body>
</html>
